# Forge Growth — self-contained stack.
#
#   cp .env.example .env
#   ./scripts/generate-secrets.sh >> .env
#   docker compose up -d
#   ./scripts/migrate.sh
#
# Then open http://localhost:8080 and sign in with the credentials printed in
# `docker compose logs backend`.
#
# ⚠ Only the web frontend publishes a host port. Postgres, Redis and MinIO stay
#   on the internal network — exposing a database to the internet is the single
#   most common way a self-hosted deployment gets compromised. Uncomment a
#   `ports:` block only for local debugging, and bind to 127.0.0.1 when you do.

name: forgegrowth

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-forgegrowth}
      POSTGRES_USER: ${POSTGRES_USER:-forgegrowth}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # Depends-on alone only waits for the container to START. Postgres accepts
      # connections seconds later, so without this the backend's first query
      # fails and it exits before Postgres is genuinely ready.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-forgegrowth} -d ${POSTGRES_DB:-forgegrowth}"]
      interval: 5s
      timeout: 5s
      retries: 20
    # ports: ["127.0.0.1:5432:5432"]   # local debugging only

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # AOF on: a queued-but-unsent WhatsApp message should survive a restart.
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-forgegrowth}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
    # ports: ["127.0.0.1:9001:9001"]   # MinIO console, local debugging only

  backend:
    build:
      # The repo root, not ./backend — the image bakes in supabase/migrations and
      # forge-growth-plugin, which sit outside ./backend. See backend/Dockerfile.
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
      minio:    { condition: service_healthy }
    env_file: [.env]
    environment:
      # Pinned here rather than left to .env: these must match the service names
      # on this network, and a stale value in a hand-edited .env is a confusing
      # failure ("connection refused" against a host that does not exist).
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      MINIO_ENDPOINT: minio
      MINIO_PORT: "9000"
      PORT: "3013"
      NODE_ENV: production
    volumes:
      - uploads:/app/uploads   # team profile pictures
      - media:/app/media       # downloaded WhatsApp media
      # The Claude plugin, served as a .zip from Admin Settings -> MCP Tools.
      # Bind-mounted rather than COPYed because the build context is ./backend
      # and this lives beside it. Read-only: the app only ever packages it.
      # Without this the download returns a 404 explaining the mount is missing,
      # which is a clear message rather than a broken button.
      - ./forge-growth-plugin:/app/plugin:ro

  web:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on: [backend]
    ports:
      # WEB_BIND is 0.0.0.0 unless TLS is on, when install.sh sets it to
      # 127.0.0.1: with caddy terminating in front, the plain-HTTP port should
      # not also be reachable from outside — otherwise the site is served twice,
      # once without a certificate.
      - "${WEB_BIND:-0.0.0.0}:${WEB_PORT:-8080}:80"

  # HTTPS for a public domain. Off unless COMPOSE_PROFILES=tls, which
  # `install.sh --domain <host>` writes into .env — so every later
  # `docker compose up -d` keeps it on without remembering a flag.
  #
  # Caddy is here rather than Traefik or nginx because a certificate is the
  # whole job: given a domain it obtains and renews one from Let's Encrypt with
  # no configuration, no resolver to define and no acme.json to create. On a
  # server that ALREADY runs a reverse proxy, leave this off and point that
  # proxy at WEB_PORT instead.
  #
  # ⚠ Ports 80 and 443 must be free and reachable from the internet: the
  # certificate is issued by a challenge that Let's Encrypt makes to this host
  # over port 80. install.sh checks both before starting.
  caddy:
    image: caddy:2-alpine
    profiles: [tls]
    restart: unless-stopped
    depends_on: [web]
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Consumed by ./caddy/Caddyfile.
      #
      # ⚠ Plain defaults, NOT `${TLS_DOMAIN:?...}`. Compose interpolates every
      # service when it loads the file — including ones whose profile is off —
      # so a required-variable marker here would break `docker compose up` for
      # everybody who never asked for HTTPS. Both values are always written by
      # `install.sh --domain`; setting the profile by hand without them is what
      # the fallback below reports.
      TLS_DOMAIN: ${TLS_DOMAIN:-tls-domain-not-set.invalid}
      # An email address gets a real Let's Encrypt certificate; the word
      # "internal" self-signs instead, for a domain with no public DNS.
      TLS_EMAIL: ${TLS_EMAIL:-internal}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates live here. Without this volume every recreate re-issues,
      # and Let's Encrypt rate-limits that to five per week per domain.
      - caddydata:/data
      - caddyconfig:/config

volumes:
  pgdata:
  redisdata:
  miniodata:
  uploads:
  media:
  caddydata:
  caddyconfig:
