# Forge Growth — run from published images, with NO source code on the machine.
#
# This file is the whole install. You need it and a .env, nothing else:
#
#   curl -o docker-compose.yml https://raw.githubusercontent.com/Forgemind-git/ForgeGrowth-OSS/main/docker-compose.images.yml
#   curl -o .env               https://raw.githubusercontent.com/Forgemind-git/ForgeGrowth-OSS/main/.env.example
#   # edit .env — at minimum POSTGRES_PASSWORD, MINIO_ROOT_PASSWORD,
#   #             FORGECRM_JWT_SECRET, FORGECRM_ENCRYPTION_KEY (32-byte hex),
#   #             META_WEBHOOK_VERIFY_TOKEN
#   docker compose up -d
#
# Then read the generated admin password out of the log:
#   docker compose logs backend | grep -A5 "FIRST-RUN ADMIN"
#
# The backend applies its own migrations at startup (they are baked into the
# image), so there is no migrate step and no psql needed on the host.
#
# ⚠ Only the web frontend publishes a host port. Postgres, Redis and MinIO stay
#   on the internal network — exposing a database to the internet is the single
#   most common way a self-hosted deployment gets compromised.
#
# To pin a version instead of tracking latest, set FORGEGROWTH_TAG in .env.

name: forgegrowth

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-forgegrowth}
      POSTGRES_USER: ${POSTGRES_USER:-forgegrowth}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # depends_on alone only waits for the container to START; Postgres accepts
      # connections seconds later.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-forgegrowth} -d ${POSTGRES_DB:-forgegrowth}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # AOF on: a queued-but-unsent WhatsApp message should survive a restart.
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-forgegrowth}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    # The service name is load-bearing: the web image's nginx config proxies to
    # the literal host `backend:3013`. Renaming this service 502s the whole UI.
    image: ghcr.io/forgemind-git/forgegrowth-backend:${FORGEGROWTH_TAG:-latest}
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
      minio:    { condition: service_healthy }
    env_file: [.env]
    environment:
      # Pinned here rather than left to .env: these must match the service names
      # on this network, and a stale hand-edited value fails as "connection
      # refused" against a host that does not exist.
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      MINIO_ENDPOINT: minio
      MINIO_PORT: "9000"
      PORT: "3013"
      NODE_ENV: production
      # Set to 0 if migrations are applied by something else.
      AUTO_MIGRATE: ${AUTO_MIGRATE:-1}
    volumes:
      - uploads:/app/uploads   # team profile pictures
      - media:/app/media       # downloaded WhatsApp media
      # No plugin bind-mount here, unlike the build-from-source compose: the
      # plugin is baked into the image precisely so this path needs no repo.

  web:
    image: ghcr.io/forgemind-git/forgegrowth-web:${FORGEGROWTH_TAG:-latest}
    restart: unless-stopped
    depends_on: [backend]
    ports:
      - "${WEB_PORT:-8080}:80"

volumes:
  pgdata:
  redisdata:
  miniodata:
  uploads:
  media:
