# Framing policy, decided from the ORIGINAL request URI.
#
# ⚠ THIS CANNOT BE DONE WITH add_header INSIDE A location BLOCK. The SPA is
# served by `try_files … /index.html`, which performs an INTERNAL REDIRECT: the
# rewritten URI (/index.html) is matched against the locations again, so it
# always lands in `location /` and inherits ITS headers — whatever block the
# browser's original path matched. A location block with its own header is
# silently overridden, and the only way to notice is to request the
# real URL and read the response headers back.
#
# $request_uri is the untouched original, so this map is immune to that.
# An EMPTY value makes nginx omit the header entirely.
#
# X-Frame-Options CANNOT express "self plus one other origin" — ALLOW-FROM
# is dead in every current browser. The allowlist therefore lives in CSP
# frame-ancestors — which browsers honour in preference to X-Frame-Options —
# and XFO is omitted rather than sent. To let another site of yours embed this
# app, add its origin after 'self' below.
map $request_uri $forge_frame_options {
  default   "";
}
map $request_uri $forge_frame_csp {
  default   "frame-ancestors 'self'";
}

server {
  listen 80;
  server_name localhost;

  # The app is not framable — a logged-in CRM inside somebody else's iframe is a
  # clickjacking target, and before this it could be framed by anyone (nginx
  # sets no framing headers by default, and helmet's frame-ancestors only covers
  # responses the BACKEND writes; this HTML comes from nginx).
  add_header X-Frame-Options $forge_frame_options always;
  add_header Content-Security-Policy $forge_frame_csp always;
  root /usr/share/nginx/html;
  index index.html;

  # Use Docker's embedded DNS so backend hostnames are re-resolved at runtime.
  # Without this, nginx resolves `forgecrm-backend` ONCE at startup and caches
  # the IP forever — so when the backend container is recreated and gets a new
  # IP, every proxied request (/uploads, /api/events, /l/) 502s with
  # "connect() failed (111: Connection refused)" until nginx is restarted.
  # Profile pictures + media silently broke this way. valid=10s = re-resolve
  # every 10s; using a $variable in proxy_pass forces nginx to use the resolver.
  resolver 127.0.0.11 valid=10s ipv6=off;
  resolver_timeout 5s;

  # The $backend variable defers DNS resolution to request time (vs. a bare
  # hostname in proxy_pass, which is resolved + cached once at config load).
  set $backend "backend:3013";

  # OAuth discovery for the MCP connector. RFC 8414/9728 anchor these documents
  # at the ORIGIN, not under /api, so they must be proxied explicitly — the
  # /api rule below never sees them.
  #
  # ⚠ This block previously returned a hard 404 on purpose: there was no OAuth
  # server, and the SPA catch-all (try_files … /index.html) was answering the
  # probes with 200 + HTML, which made connectors conclude an authorization
  # server existed and fail with "Couldn't register with forge growth's sign-in
  # service." Now there IS a real server (backend routes/mcpOAuth.js), so these
  # proxy through. If discovery ever starts returning the SPA again, this block
  # is the first thing to check — a 200 of HTML here is worse than a 404.
  #
  # Prefix-matched (not exact) so the RFC 9728 resource-specific form
  # /.well-known/oauth-protected-resource/api/mcp reaches the backend too.
  location ~ ^/\.well-known/(oauth-authorization-server|oauth-protected-resource|openid-configuration) {
    # Deliberately NOT setting X-Forwarded-Proto: $scheme is "http" on the
    # Traefik→nginx hop, so setting it would OVERWRITE the real "https" Traefik
    # already sent and make the issuer/metadata URLs http — which clients reject.
    # Incoming headers pass through untouched, same as the /api block.
    proxy_pass http://$backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  # The SPA. Its framing headers are decided by the maps above rather than
  # here — see the note on internal redirects.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # SSE endpoint — must stream, not buffer; long-lived connections.
  location = /api/events {
    proxy_pass http://$backend/api/events;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Connection '';
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 24h;
    chunked_transfer_encoding on;
  }

  location /api {
    # ⚠ nginx defaults to 1 MB, so WITHOUT THIS every upload over 1 MB (Media
    # Library videos, sheet imports) is refused here with a raw 413 and never
    # reaches Express — the app's own size limits would be decorative. Kept
    # generous so the friendly refusal comes from the app, not from here.
    client_max_body_size 210m;
    proxy_pass http://$backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # A 200 MB upload over a slow mobile connection takes a while; the default
    # 60s read timeout would drop it mid-transfer.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }

  location /uploads {
    proxy_pass http://$backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location /l/ {
    proxy_pass http://$backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  # Payment-link redirect — the destination of a payment template's URL button.
  #
  # ⚠ WITHOUT THIS BLOCK THE SPA CATCH-ALL ANSWERS IT. `try_files … /index.html`
  # returns 200 + the React shell for any unmatched root path, so every customer
  # tapping "Pay now" would land on the CRM login screen instead of the payment
  # gateway — and it would look like a working page, not an error. Exactly the
  # failure already documented for the /.well-known/oauth* paths above.
  location /pay/ {
    proxy_pass http://$backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }
}
